<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baldi School 3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* MENUS & OVERLAYS */
.menu-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #45a049 0%, #1e5128 100%);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    user-select: none;
}

.menu-overlay h1 {
    font-size: 50px;
    margin-bottom: 30px;
    text-shadow: 4px 4px 0px #000;
    color: #ffff00;
    letter-spacing: 2px;
}

.menu-overlay h2 {
    font-size: 36px;
    margin-bottom: 30px;
    text-shadow: 3px 3px 0px #000;
}

.menu-btn {
    background-color: #ffffff;
    color: #000;
    border: 4px solid #000;
    padding: 12px 35px;
    font-size: 22px;
    font-weight: bold;
    margin: 10px;
    cursor: pointer;
    box-shadow: 5px 5px 0px #000;
    transition: transform 0.1s, box-shadow 0.1s;
}

.menu-btn:hover {
    background-color: #ffff00;
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0px #000;
}

.menu-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px #000;
}

.setting-item {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0;
    display: flex;
    align-items: center;
    gap: 15px;
    text-shadow: 2px 2px 0px #000;
}

.setting-item input[type="range"] {
    cursor: pointer;
    width: 200px;
}

.setting-item input[type="checkbox"] {
    transform: scale(1.8);
    cursor: pointer;
}

/* GAME UI */
#ui{
    position:fixed;
    top:10px;
    left:10px;
    color:white;
    z-index:100;
    font-size:24px;
    user-select: none;
}

#staminaBar{
    width:220px;
    height:24px;
    background:#444;
    border:2px solid white;
    margin-top:10px;
}

#stamina{
    width:100%;
    height:100%;
    background:lime;
}

#crosshair{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width: 14px;
    height: 14px;
    background-color: black;
    border: 2px solid white;
    z-index:100;
    user-select: none;
    pointer-events: none;
    box-sizing: border-box;
}

#crosshair.active {
    width: 48px;
    height: 48px;
    background-color: transparent;
    border: none;
    background-image: url('https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/0/07/CursorSprite_Classic.png/revision/latest?cb=20181121201102');
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}

#itemBar{
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 100;
    user-select: none;
}

.slot{
    width: 64px;
    height: 64px;
    border: 4px solid #666;
    background-color: rgba(0, 0, 0, 0.7);
    background-size: 80%;
    background-repeat: no-repeat;
    background-position: center;
    transition: border-color 0.1s;
}

.slot.active{
    border-color: red;
    background-color: rgba(255, 255, 255, 0.2);
}

/* ON-SCREEN SPATIAL CAPTION SYSTEM */
#captionLayer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 150;
    overflow: hidden;
}

.screen-caption {
    position: absolute;
    background: rgba(0, 0, 0, 0.8);
    padding: 4px 12px;
    border-radius: 4px;
    border: 2px solid #fff;
    font-size: 20px;
    font-weight: bold;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 3px 3px 6px rgba(0,0,0,0.5);
}
</style>
</head>
<body>

<!-- MAIN MENU OVERLAY -->
<div id="mainMenu" class="menu-overlay">
    <h1>BALDI'S SCHOOL 3D</h1>
    <button class="menu-btn" id="btnStart">Start Game</button>
    <button class="menu-btn" id="btnSettings">Settings</button>
</div>

<!-- SETTINGS OVERLAY -->
<div id="settingsMenu" class="menu-overlay" style="display: none;">
    <h2>SETTINGS</h2>
    <div class="setting-item">
        <label for="sensSlider">Mouse Sensitivity:</label>
        <input type="range" id="sensSlider" min="1" max="10" value="5">
        <span id="sensValue">5</span>
    </div>
    <div class="setting-item">
        <label for="captionsToggle">Show Distance Captions:</label>
        <input type="checkbox" id="captionsToggle" checked>
    </div>
    <button class="menu-btn" id="btnBack">Back</button>
</div>

<!-- HUD SYSTEM -->
<div id="ui">
    Notebooks: <span id="books">0</span>/7
    <div id="staminaBar">
        <div id="stamina"></div>
    </div>
</div>

<div id="crosshair"></div>
<div id="captionLayer"></div>

<div id="itemBar">
    <div class="slot active" id="slot0"></div>
    <div class="slot" id="slot1"></div>
    <div class="slot" id="slot2"></div>
</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

////////////////////////////////////////////////////////
// CONFIGURATION & GLOBAL STATE
////////////////////////////////////////////////////////

let gameStarted = false;
let mouseSensitivity = 0.002; 
let showCaptions = true;
const activeCaptions = [];

////////////////////////////////////////////////////////
// ON-SCREEN SPATIAL CAPTIONS SYSTEM
////////////////////////////////////////////////////////

let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// Spawns a crisp on-screen element synced with a 3D coordinate spot
function triggerScreenCaption(text, vector3Pos, color = "#ffffff") {
    if (!showCaptions) return;

    const el = document.createElement('div');
    el.className = 'screen-caption';
    el.textContent = text;
    el.style.borderColor = color;
    el.style.color = color;
    
    document.getElementById('captionLayer').appendChild(el);
    
    activeCaptions.push({
        element: el,
        pos: vector3Pos.clone().add(new THREE.Vector3(0, 2.5, 0)), // Spawn slightly elevated
        life: 80 
    });
}

function playSlapSound(pos) {
    initAudio();
    triggerScreenCaption("*Ruler Slap*", pos, "#ff3333");
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.08);
}

function playPickupSound(pos) {
    initAudio();
    triggerScreenCaption("*Item Collected*", pos, "#33ff33");
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08); 
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16); 
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

function playSpraySound(pos) {
    initAudio();
    triggerScreenCaption("*BSODA Spray Burst*", pos, "#33ccff");
    if(!audioCtx) return;
    const bufferSize = audioCtx.sampleRate * 0.4;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    noise.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
}

function playJumpscareSound(pos) {
    initAudio();
    triggerScreenCaption("*LOUD SCREAM*", pos, "#ff0000");
    if(!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(90, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 1.2);
    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 1.2);
}

////////////////////////////////////////////////////////
// TEXTURES
////////////////////////////////////////////////////////

const loader = new THREE.TextureLoader();

const floorTexture = loader.load("https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/c/cc/TileFloor.png/revision/latest?cb=20190102095521");
floorTexture.wrapS = THREE.RepeatWrapping;
floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(100,100);

const wallTexture = loader.load("https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/9/96/Wall.png/revision/latest?cb=20200511073033");
wallTexture.wrapS = THREE.RepeatWrapping;
wallTexture.wrapT = THREE.RepeatWrapping;
wallTexture.repeat.set(8,8);

const ceilingTexture = loader.load("https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/0/0a/CeilingNoLight.png/revision/latest?cb=20200804032837");
ceilingTexture.wrapS = THREE.RepeatWrapping;
ceilingTexture.wrapT = THREE.RepeatWrapping;
ceilingTexture.repeat.set(8,8);

const baldiTexture = loader.load("https://static.wikia.nocookie.net/noob6/images/9/9d/Baldi-0.png/revision/latest?cb=20180923123411");
const principalTexture = loader.load("https://i.pinimg.com/736x/f2/2b/2b/f22b2bd155cf63686a7df1badaf72684.jpg");
const notebookTexture = loader.load("https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/9/9c/NotebookSheet_4.png/revision/latest?cb=20210626081835");

const bsodaTextureURL = "https://static.wikia.nocookie.net/baldis-basics-in-education-and-learning/images/3/3a/BsodaIcon_Large.png/revision/latest?cb=20250627002908";
const bsodaTexture = loader.load(bsodaTextureURL);

////////////////////////////////////////////////////////
// SCENE SETUP
////////////////////////////////////////////////////////

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfdfff);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(20,30,10);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff,0.5));

const floor = new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshPhongMaterial({ map:floorTexture }));
floor.rotation.x = -Math.PI/2;
scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(500,500), new THREE.MeshPhongMaterial({ map:ceilingTexture, side:THREE.DoubleSide }));
ceiling.rotation.x = Math.PI/2;
ceiling.position.y = 10;
scene.add(ceiling);

const walls = [];

function createWall(x,y,z,w,h,d){
    const wall = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshPhongMaterial({ map:wallTexture }));
    wall.position.set(x,y,z);
    scene.add(wall);
    walls.push(wall);
}

const notebooks = [];
const items = []; 
const activeSprays = []; 
let collected = 0;
let gameOver = false;

const booksUI = document.getElementById("books");
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(0, 0); 

function createNotebook(x,z){
    const notebookMaterial = new THREE.MeshPhongMaterial({ map:notebookTexture, transparent:true });
    const notebook = new THREE.Mesh(new THREE.BoxGeometry(2,2,0.2), notebookMaterial);
    notebook.userData = { isNotebook: true };
    notebook.position.set(x, 2, z);
    scene.add(notebook);
    notebooks.push(notebook);
}

function createItem(x, z) {
    const itemMaterial = new THREE.SpriteMaterial({ map: bsodaTexture });
    const item = new THREE.Sprite(itemMaterial);
    item.scale.set(1.5, 1.5, 1);
    item.position.set(x, 2, z);
    item.userData = { isItem: true, itemName: "BSODA", iconURL: bsodaTextureURL };
    scene.add(item);
    items.push(item);
}

function createClassroom(x,z){
    const classroomFloor = new THREE.Mesh(new THREE.PlaneGeometry(38,38), new THREE.MeshPhongMaterial({ map:floorTexture }));
    classroomFloor.rotation.x = -Math.PI/2;
    classroomFloor.position.set(x, 0.01, z);
    scene.add(classroomFloor);

    const roomLight = new THREE.PointLight(0xffffff, 1.2, 60);
    roomLight.position.set(x, 8, z);
    scene.add(roomLight);

    createWall(x,5,z-20,40,10,2);
    createWall(x-12,5,z+20,14,10,2);
    createWall(x+12,5,z+20,14,10,2);
    createWall(x-20,5,z,2,10,40);
    createWall(x+20,5,z,2,10,40);

    const door = new THREE.Mesh(new THREE.BoxGeometry(8,8,0.5), new THREE.MeshPhongMaterial({ color:0x8b5a2b }));
    door.position.set(x, 4, z+20);
    scene.add(door);

    for(let i=-10;i<=10;i+=10){
        const windowMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5,4,6), new THREE.MeshPhongMaterial({ color:0x87ceeb, transparent:true, opacity:0.6 }));
        windowMesh.position.set(x-19.5, 5, z+i);
        scene.add(windowMesh);
    }

    for(let row=-8; row<=8; row+=8){
        for(let col=-10; col<=10; col+=10){
            const desk = new THREE.Mesh(new THREE.BoxGeometry(4,2,3), new THREE.MeshPhongMaterial({ color:0x8b5a2b }));
            desk.position.set(x + col, 1, z + row);
            scene.add(desk);
            const chair = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshPhongMaterial({ color:0x444444 }));
            chair.position.set(x + col, 1, z + row + 3);
            scene.add(chair);
        }
    }

    const teacherDesk = new THREE.Mesh(new THREE.BoxGeometry(10,3,4), new THREE.MeshPhongMaterial({ color:0x5a381e }));
    teacherDesk.position.set(x, 1.5, z-13);
    scene.add(teacherDesk);

    const board = new THREE.Mesh(new THREE.BoxGeometry(16,6,0.5), new THREE.MeshPhongMaterial({ color:0x003300 }));
    board.position.set(x, 5, z-18.5);
    scene.add(board);

    createNotebook(x,z);
    createItem(x + 15, z - 15);
}

// Map Builds
createWall(0,5,-200,400,10,2); createWall(0,5,200,400,10,2);
createWall(-200,5,0,2,10,400); createWall(200,5,0,2,10,400);
createWall(0,5,-60,2,10,280);

createClassroom(-80,-120); createClassroom(-80,-40); createClassroom(-80,40); createClassroom(-80,120);
createClassroom(80,-120); createClassroom(80,-40); createClassroom(80,40); createClassroom(80,120);

function checkCollision(x,z){
    for(let wall of walls){
        const dx = Math.abs(x - wall.position.x);
        const dz = Math.abs(z - wall.position.z);
        const hw = wall.geometry.parameters.width/2;
        const hd = wall.geometry.parameters.depth/2;
        if(dx < hw + 1.5 && dz < hd + 1.5) return true;
    }
    return false;
}

function getSafeSpawn(){
    while(true){
        const x = Math.random()*300 - 150;
        const z = Math.random()*300 - 150;
        if(!checkCollision(x,z)) return {x,z};
    }
}

const spawn = getSafeSpawn();
camera.position.set(spawn.x, 2, spawn.z);

////////////////////////////////////////////////////////
// INVENTORY SYSTEM
////////////////////////////////////////////////////////

let inventory = [null, null, null]; 
let activeSlot = 0;

function setActiveSlot(index) {
    document.getElementById(`slot${activeSlot}`).classList.remove('active');
    activeSlot = index;
    document.getElementById(`slot${activeSlot}`).classList.add('active');
}

function giveItem(itemData, targetPos) {
    for (let i = 0; i < inventory.length; i++) {
        if (inventory[i] === null) {
            inventory[i] = itemData;
            document.getElementById(`slot${i}`).style.backgroundImage = `url('${itemData.iconURL}')`;
            playPickupSound(targetPos); 
            return true; 
        }
    }
    return false; 
}

function useActiveItem() {
    if (!gameStarted) return;
    const currentItem = inventory[activeSlot];
    if (!currentItem) return;

    if (currentItem.itemName === "BSODA") {
        playSpraySound(camera.position); 

        const sprayGeo = new THREE.SphereGeometry(2.5, 16, 16);
        const sprayMat = new THREE.MeshBasicMaterial({ color: 0x00bcff, transparent: true, opacity: 0.65 });
        const sprayMesh = new THREE.Mesh(sprayGeo, sprayMat);
        sprayMesh.position.set(camera.position.x, 2, camera.position.z);
        scene.add(sprayMesh);

        const vx = -Math.sin(rotY) * 0.45;
        const vz = -Math.cos(rotY) * 0.45;

        activeSprays.push({ mesh: sprayMesh, vx: vx, vz: vz, life: 180 });
        inventory[activeSlot] = null;
        document.getElementById(`slot${activeSlot}`).style.backgroundImage = '';
    }
}

////////////////////////////////////////////////////////
// INPUTS & MOUSE INTERACTION
////////////////////////////////////////////////////////

let rotY = 0;
let lookingBehind = false;
const keys = {};

let walkSpeed = 0.12;
let sprintSpeed = 0.22;
let stamina = 100;

document.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("mousedown", (e) => {
    if (!gameStarted) return;
    initAudio(); 
    
    if (document.pointerLockElement !== document.body) {
        document.body.requestPointerLock();
        return;
    }

    if (e.button === 0) {
        raycaster.setFromCamera(mouse, camera);
        const interactables = [...notebooks, ...items];
        const intersects = raycaster.intersectObjects(interactables);
        
        if (intersects.length > 0) {
            const hitObj = intersects[0].object;
            const pDx = camera.position.x - hitObj.position.x;
            const pDz = camera.position.z - hitObj.position.z;
            const playerDist = Math.sqrt(pDx*pDx + pDz*pDz);
            
            if(hitObj.visible && playerDist < 12) {
                const targetPos = hitObj.position.clone();
                if(hitObj.userData.isNotebook) {
                    hitObj.visible = false;
                    collected++;
                    booksUI.textContent = collected;
                    playPickupSound(targetPos); 

                    if(collected >= 7){
                        alert("YOU WIN!");
                        location.reload();
                    }
                }
                if(hitObj.userData.isItem) {
                    if(giveItem(hitObj.userData, targetPos)) hitObj.visible = false; 
                }
            }
        }
    }
    
    if (e.button === 2) useActiveItem();
});

document.addEventListener("mousemove",(e)=>{
    if(document.pointerLockElement === document.body && gameStarted){
        rotY -= e.movementX * mouseSensitivity;
    }
});

document.addEventListener("keydown",(e)=>{
    if (!gameStarted) return;
    initAudio();
    keys[e.key.toLowerCase()] = true;
    if(e.code === "Space") lookingBehind = true;
    if(e.key === "1") setActiveSlot(0);
    if(e.key === "2") setActiveSlot(1);
    if(e.key === "3") setActiveSlot(2);
});

document.addEventListener("keyup",(e)=>{
    keys[e.key.toLowerCase()] = false;
    if(e.code === "Space") lookingBehind = false;
});

document.addEventListener("wheel", (e) => {
    if (document.pointerLockElement === document.body && gameStarted) {
        if (e.deltaY > 0) {
            setActiveSlot((activeSlot + 1) % 3);
        } else {
            setActiveSlot((activeSlot - 1 + 3) % 3);
        }
    }
});

////////////////////////////////////////////////////////
// MENU CONFIG SYSTEM
////////////////////////////////////////////////////////

const mainMenu = document.getElementById("mainMenu");
const settingsMenu = document.getElementById("settingsMenu");
const sensSlider = document.getElementById("sensSlider");
const sensValue = document.getElementById("sensValue");
const captionsToggle = document.getElementById("captionsToggle");

function updateSensitivityFromSlider() {
    const val = parseInt(sensSlider.value);
    sensValue.textContent = val;
    mouseSensitivity = val * 0.0004; 
}
updateSensitivityFromSlider();

sensSlider.addEventListener("input", updateSensitivityFromSlider);
captionsToggle.addEventListener("change", () => {
    showCaptions = captionsToggle.checked;
    if(!showCaptions) {
        // Clear screen text if toggled off instantly
        while(activeCaptions.length > 0) {
            activeCaptions.pop().element.remove();
        }
    }
});

document.getElementById("btnStart").addEventListener("click", () => {
    mainMenu.style.display = "none";
    gameStarted = true;
    initAudio();
    document.body.requestPointerLock();
});

document.getElementById("btnSettings").addEventListener("click", () => {
    mainMenu.style.display = "none";
    settingsMenu.style.display = "flex";
});

document.getElementById("btnBack").addEventListener("click", () => {
    settingsMenu.style.display = "none";
    mainMenu.style.display = "flex";
});

document.addEventListener('pointerlockchange', () => {
    if (document.pointerLockElement !== document.body && gameStarted) {
        gameStarted = false;
        mainMenu.style.display = "flex";
    }
});

////////////////////////////////////////////////////////
// NPC ENTITIES
////////////////////////////////////////////////////////

const baldiMaterial = new THREE.SpriteMaterial({ map:baldiTexture });
const baldi = new THREE.Sprite(baldiMaterial);
baldi.scale.set(1.5,4,1);
baldi.position.set(50, 2, 50);
scene.add(baldi);

const principalMaterial = new THREE.SpriteMaterial({ map:principalTexture });
const principal = new THREE.Sprite(principalMaterial);
principal.scale.set(1.5,4,1);
principal.position.set(-50, 2, -50);
scene.add(principal);

////////////////////////////////////////////////////////
// MAIN GAME LOOP ENGINE
////////////////////////////////////////////////////////

let slapTimer = 0;
const projectedVector = new THREE.Vector3();
const cameraDirection = new THREE.Vector3();

function animate(){
    requestAnimationFrame(animate);

    if (gameOver) return; 

    if (!gameStarted) {
        renderer.render(scene, camera);
        return;
    }

    // SCREEN SPACE SPATIAL CAPTION ENGINE
    camera.getWorldDirection(cameraDirection);
    for (let i = activeCaptions.length - 1; i >= 0; i--) {
        const cap = activeCaptions[i];
        cap.life--;

        if (cap.life <= 0) {
            cap.element.remove();
            activeCaptions.splice(i, 1);
            continue;
        }

        // Float slightly upwards in world coordinates over time
        cap.pos.y += 0.015;

        // Calculate direct 3D distance for scaling properties
        const dist = camera.position.distanceTo(cap.pos);
        
        // Check if the sound location is behind our viewport direction
        const toTarget = new THREE.Vector3().subVectors(cap.pos, camera.position);
        const isBehind = toTarget.dot(cameraDirection) < 0;

        if (isBehind) {
            cap.element.style.display = "none";
        } else {
            cap.element.style.display = "block";

            // Project 3D vector coordinates to screen device limits (-1 to +1 space)
            projectedVector.copy(cap.pos);
            projectedVector.project(camera);

            // Turn device coordinates directly into layout pixels
            const x = (projectedVector.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(projectedVector.y * 0.5) + 0.5) * window.innerHeight;

            // Compute Scale: Close sounds = 1.2x scale, distant sounds down to 0.35x size
            let distanceScale = 1.2 - (dist / 140);
            distanceScale = Math.max(0.35, Math.min(1.2, distanceScale));

            cap.element.style.left = `${x}px`;
            cap.element.style.top = `${y}px`;
            cap.element.style.transform = `translate(-50%, -50%) scale(${distanceScale})`;

            // Smooth fadeout exit opacity
            if (cap.life < 20) {
                cap.element.style.opacity = cap.life / 20;
            } else {
                cap.element.style.opacity = 1;
            }
        }
    }

    // CROSSHAIR LOOK RAYCASTS
    raycaster.setFromCamera(mouse, camera);
    const interactables = [...notebooks, ...items];
    const intersects = raycaster.intersectObjects(interactables);
    
    let canInteract = false;
    if (intersects.length > 0) {
        const hitObj = intersects[0].object;
        const pDx = camera.position.x - hitObj.position.x;
        const pDz = camera.position.z - hitObj.position.z;
        const playerDist = Math.sqrt(pDx*pDx + pDz*pDz);
        
        if (hitObj.visible && playerDist < 12) {
            canInteract = true;
        }
    }

    const crosshairEl = document.getElementById("crosshair");
    if (canInteract) {
        crosshairEl.classList.add("active");
    } else {
        crosshairEl.classList.remove("active");
    }

    // STAMINA CALCULATIONS
    let speed = walkSpeed;
    if(keys["shift"] && stamina > 0){
        speed = sprintSpeed;
        stamina -= 0.5;
    }else{
        stamina += 0.2;
    }
    stamina = Math.max(0, Math.min(100,stamina));
    document.getElementById("stamina").style.width = stamina + "%";

    camera.rotation.y = lookingBehind ? rotY + Math.PI : rotY;

    // INPUT MOVEMENT VECTORS
    const forwardX = -Math.sin(rotY);
    const forwardZ = -Math.cos(rotY);
    const rightX = Math.cos(rotY);
    const rightZ = -Math.sin(rotY);

    let nextX = camera.position.x;
    let nextZ = camera.position.z;

    if(keys["w"]){ nextX += forwardX * speed; nextZ += forwardZ * speed; }
    if(keys["s"]){ nextX -= forwardX * speed; nextZ -= forwardZ * speed; }
    if(keys["a"]){ nextX -= rightX * speed; nextZ -= rightZ * speed; }
    if(keys["d"]){ nextX += rightX * speed; nextZ += rightZ * speed; }

    if(!checkCollision(nextX,nextZ)){
        camera.position.x = nextX;
        camera.position.z = nextZ;
    }

    // BALDI PATROL VECTOR LOGIC
    let baldiSpeedX = (camera.position.x - baldi.position.x);
    let baldiSpeedZ = (camera.position.z - baldi.position.z);
    let dist = Math.sqrt(baldiSpeedX*baldiSpeedX + baldiSpeedZ*baldiSpeedZ);

    let baldiNextX = baldi.position.x;
    let baldiNextZ = baldi.position.z;

    let slapInterval = Math.max(18, 100 - collected * 12); 
    slapTimer++;

    if (slapTimer >= slapInterval) {
        slapTimer = 0;
        playSlapSound(baldi.position); 
        
        if (dist > 0.1) {
            let stepSize = 4.2; 
            baldiNextX += (baldiSpeedX / dist) * stepSize;
            baldiNextZ += (baldiSpeedZ / dist) * stepSize;
        }
    }

    // BSODA FLUID VECTOR FORCE TRACKING
    for (let i = activeSprays.length - 1; i >= 0; i--) {
        const spray = activeSprays[i];
        spray.mesh.position.x += spray.vx;
        spray.mesh.position.z += spray.vz;
        spray.life--;

        let hitWall = checkCollision(spray.mesh.position.x, spray.mesh.position.z);

        const bDx = baldi.position.x - spray.mesh.position.x;
        const bDz = baldi.position.z - spray.mesh.position.z;
        const bDist = Math.sqrt(bDx*bDx + bDz*bDz);

        if (bDist < 5.0) {
            let pushX = baldiNextX + spray.vx * 1.5;
            let pushZ = baldiNextZ + spray.vz * 1.5;
            if(!checkCollision(pushX, pushZ)) {
                baldiNextX = pushX;
                baldiNextZ = pushZ;
            }
        }

        if (spray.life <= 0 || hitWall) {
            scene.remove(spray.mesh);
            activeSprays.splice(i, 1);
        }
    }

    baldi.position.x = baldiNextX;
    baldi.position.z = baldiNextZ;
    baldi.lookAt(camera.position);

    if(dist < 2 && !gameOver){
        gameOver = true;
        playJumpscareSound(camera.position);
        setTimeout(() => {
            alert("Baldi got you!");
            location.reload();
        }, 1000); 
    }

    // SPRITE ALIGNMENT RENDERS
    principal.lookAt(camera.position);
    items.forEach(item => { if(item.visible) item.lookAt(camera.position); });
    notebooks.forEach(note => { if(note.visible) note.lookAt(camera.position); });

    renderer.render(scene,camera);
}

animate();

////////////////////////////////////////////////////////
// RESIZE
////////////////////////////////////////////////////////

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
