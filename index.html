<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baldi's Basics Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
        }
        
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
            font-size: 48px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
        }
        
        #winScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 48px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 30px;
            border-radius: 15px;
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 10px;
            white-space: nowrap;
        }
        
        .pointer-lock-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 20px 30px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui">Notebooks: 0/7</div>
    
    <div id="gameOver">
        GAME OVER!<br>
        <span style="font-size: 24px;">Press R to restart</span>
    </div>
    
    <div id="winScreen">
        YOU WIN!<br>
        <span style="font-size: 24px;">All notebooks collected!</span>
    </div>
    
    <div class="instructions">
        🖱️ Click to play | WASD: Move | Mouse: Look | Click: Collect | Space: Jump | R: Restart | ESC: Release mouse
    </div>
    
    <div class="pointer-lock-prompt" id="lockPrompt">
        🎮 Click anywhere to start playing
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Game state
        let gameOver = false;
        let gameWon = false;
        let notebooksCollected = 0;
        const notebooksNeeded = 7;
        let isLocked = false;
        
        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 60);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Pointer lock setup
        const lockPrompt = document.getElementById('lockPrompt');
        
        function lockPointer() {
            renderer.domElement.requestPointerLock();
        }
        
        renderer.domElement.addEventListener('click', lockPointer);
        lockPrompt.addEventListener('click', lockPointer);
        
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
            lockPrompt.style.display = isLocked ? 'none' : 'block';
        });
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // Player setup
        const player = {
            height: 1.7,
            speed: 8,
            jumpForce: 8,
            gravity: 20
        };
        
        const playerVelocity = new THREE.Vector3();
        const playerDirection = new THREE.Vector3();
        let playerOnGround = true;
        
        // Camera rotation
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        euler.order = 'YXZ';
        
        // Create school environment
        function createSchool() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xB4B4B4,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Floor tiles pattern
            const tileGeometry = new THREE.PlaneGeometry(2, 2);
            const tileMaterial1 = new THREE.MeshStandardMaterial({ color: 0xC4C4C4, roughness: 0.7 });
            const tileMaterial2 = new THREE.MeshStandardMaterial({ color: 0xA4A4A4, roughness: 0.7 });
            
            for (let x = -24; x < 25; x += 2) {
                for (let z = -24; z < 25; z += 2) {
                    const tile = new THREE.Mesh(tileGeometry, (x + z) % 4 === 0 ? tileMaterial1 : tileMaterial2);
                    tile.rotation.x = -Math.PI / 2;
                    tile.position.set(x, 0.01, z);
                    tile.receiveShadow = true;
                    scene.add(tile);
                }
            }
            
            // Walls
            const wallMaterial = new THREE.MeshStandardMaterial({ color: 0xC8C8C8, roughness: 0.9 });
            
            function createWall(x, z, width, depth) {
                const geometry = new THREE.BoxGeometry(width, 4, depth);
                const wall = new THREE.Mesh(geometry, wallMaterial);
                wall.position.set(x, 2, z);
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            }
            
            // Outer walls
            createWall(0, 25, 50, 1);
            createWall(0, -25, 50, 1);
            createWall(25, 0, 1, 50);
            createWall(-25, 0, 1, 50);
            
            // Inner walls
            createWall(-10, 0, 1, 30);
            createWall(10, 0, 1, 30);
            
            // Desks and chairs
            const deskMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.7 });
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.6 });
            
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 3; j++) {
                    const x = -7 + i * 3;
                    const z = -10 + j * 5;
                    
                    const deskTop = new THREE.Mesh(
                        new THREE.BoxGeometry(1.5, 0.1, 1),
                        deskMaterial
                    );
                    deskTop.position.set(x, 0.6, z);
                    deskTop.castShadow = true;
                    deskTop.receiveShadow = true;
                    scene.add(deskTop);
                    
                    const legPositions = [[-0.6, -0.4], [0.6, -0.4], [-0.6, 0.4], [0.6, 0.4]];
                    legPositions.forEach(([dx, dz]) => {
                        const leg = new THREE.Mesh(
                            new THREE.BoxGeometry(0.1, 0.5, 0.1),
                            legMaterial
                        );
                        leg.position.set(x + dx, 0.3, z + dz);
                        leg.castShadow = true;
                        scene.add(leg);
                    });
                }
            }
            
            // Chalkboard
            const chalkboard = new THREE.Mesh(
                new THREE.BoxGeometry(4, 2, 0.1),
                new THREE.MeshStandardMaterial({ color: 0x1E501E, roughness: 0.9 })
            );
            chalkboard.position.set(0, 2, -24.5);
            scene.add(chalkboard);
            
            // Posters
            for (let i = 0; i < 8; i++) {
                const poster = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1.5),
                    new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color(Math.random(), Math.random(), Math.random()),
                        roughness: 0.5
                    })
                );
                poster.position.set(
                    Math.random() * 40 - 20,
                    2 + Math.random() * 1,
                    (Math.random() > 0.5 ? 24.5 : -24.5)
                );
                poster.rotation.y = poster.position.z > 0 ? Math.PI : 0;
                scene.add(poster);
            }
            
            // Ceiling lights
            for (let x = -15; x <= 15; x += 10) {
                for (let z = -15; z <= 15; z += 10) {
                    const light = new THREE.Mesh(
                        new THREE.BoxGeometry(2, 0.2, 1),
                        new THREE.MeshStandardMaterial({ 
                            color: 0xFFFFCC,
                            emissive: 0x444400
                        })
                    );
                    light.position.set(x, 3.8, z);
                    scene.add(light);
                }
            }
        }
        
        // Baldi character
        const baldi = {
            mesh: null,
            speed: 2.5,
            slapCooldown: 0,
            
            init() {
                const group = new THREE.Group();
                
                // Body
                const body = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.3, 1.8, 8),
                    new THREE.MeshStandardMaterial({ color: 0x008000 })
                );
                body.position.y = 0.9;
                body.castShadow = true;
                group.add(body);
                
                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 16, 16),
                    new THREE.MeshStandardMaterial({ color: 0xFFDBB5 })
                );
                head.position.y = 1.95;
                head.castShadow = true;
                group.add(head);
                
                // Ruler
                const ruler = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.8),
                    new THREE.MeshStandardMaterial({ color: 0x8B4513 })
                );
                ruler.position.set(0.3, 1.2, 0);
                ruler.rotation.z = 0.3;
                group.add(ruler);
                
                // Eyes
                const eyeGeometry = new THREE.SphereGeometry(0.08, 8, 8);
                const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
                
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(-0.15, 2.05, -0.3);
                group.add(leftEye);
                
                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.position.set(0.15, 2.05, -0.3);
                group.add(rightEye);
                
                this.mesh = group;
                this.mesh.position.set(10, 0, 0);
                scene.add(this.mesh);
            },
            
            update(deltaTime) {
                if (gameOver || gameWon) return;
                
                const direction = new THREE.Vector3()
                    .subVectors(camera.position, this.mesh.position)
                    .normalize();
                direction.y = 0;
                
                this.mesh.position.add(direction.multiplyScalar(this.speed * deltaTime));
                this.mesh.lookAt(camera.position.x, this.mesh.position.y, camera.position.z);
                
                this.slapCooldown -= deltaTime;
                const distance = this.mesh.position.distanceTo(camera.position);
                
                if (distance < 2 && this.slapCooldown <= 0) {
                    this.slapPlayer();
                }
            },
            
            slapPlayer() {
                this.slapCooldown = 1.0;
                
                // Screen shake effect
                const shakeAmount = 0.1;
                camera.position.x += (Math.random() - 0.5) * shakeAmount;
                camera.position.y += (Math.random() - 0.5) * shakeAmount;
                
                gameOver = true;
                document.getElementById('gameOver').style.display = 'block';
                document.exitPointerLock();
            }
        };
        
        // Notebook class
        class Notebook {
            constructor(x, z) {
                this.mesh = new THREE.Group();
                
                const cover = new THREE.Mesh(
                    new THREE.BoxGeometry(0.4, 0.05, 0.5),
                    new THREE.MeshStandardMaterial({ 
                        color: 0x00FF00,
                        emissive: 0x004400,
                        roughness: 0.3
                    })
                );
                cover.position.y = 0.5;
                cover.castShadow = true;
                this.mesh.add(cover);
                
                const pages = new THREE.Mesh(
                    new THREE.BoxGeometry(0.35, 0.03, 0.45),
                    new THREE.MeshStandardMaterial({ color: 0xFFFFFF })
                );
                pages.position.y = 0.53;
                this.mesh.add(pages);
                
                for (let i = 0; i < 3; i++) {
                    const spiral = new THREE.Mesh(
                        new THREE.TorusGeometry(0.05, 0.02, 8, 8),
                        new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.8 })
                    );
                    spiral.position.set(-0.2, 0.5, -0.15 + i * 0.15);
                    spiral.rotation.x = Math.PI / 2;
                    this.mesh.add(spiral);
                }
                
                this.mesh.position.set(x, 0.5, z);
                this.collected = false;
                this.mesh.userData = this;
                
                scene.add(this.mesh);
            }
            
            collect() {
                if (this.collected) return;
                this.collected = true;
                notebooksCollected++;
                
                scene.remove(this.mesh);
                
                updateUI();
                spawnNotebook();
                
                if (notebooksCollected >= notebooksNeeded) {
                    gameWon = true;
                    document.getElementById('winScreen').style.display = 'block';
                    document.exitPointerLock();
                }
            }
        }
        
        const notebooks = [];
        
        function spawnNotebook() {
            let attempts = 0;
            while (attempts < 50) {
                const x = (Math.random() - 0.5) * 40;
                const z = (Math.random() - 0.5) * 40;
                
                // Check if position is valid (not in walls)
                if (Math.abs(x) < 23 && Math.abs(z) < 23 &&
                    !(Math.abs(x) > 9 && Math.abs(x) < 11 && Math.abs(z) < 15)) {
                    notebooks.push(new Notebook(x, z));
                    return;
                }
                attempts++;
            }
        }
        
        function updateUI() {
            document.getElementById('ui').textContent = 
                `Notebooks: ${notebooksCollected}/${notebooksNeeded}`;
        }
        
        // Controls
        const keyState = {};
        
        document.addEventListener('keydown', (event) => {
            keyState[event.code] = true;
            
            if (event.code === 'KeyR' && (gameOver || gameWon)) {
                restartGame();
            }
            
            if (event.code === 'Escape') {
                document.exitPointerLock();
            }
        });
        
        document.addEventListener('keyup', (event) => {
            keyState[event.code] = false;
        });
        
        document.addEventListener('mousemove', (event) => {
            if (!isLocked) return;
            
            const movementX = event.movementX || 0;
            const movementY = event.movementY || 0;
            
            euler.y -= movementX * 0.002;
            euler.x -= movementY * 0.002;
            
            // Clamp vertical rotation
            euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x));
            
            camera.quaternion.setFromEuler(euler);
        });
        
        document.addEventListener('mousedown', (event) => {
            if (!isLocked || event.button !== 0) return;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const intersects = raycaster.intersectObjects(
                notebooks.map(n => n.mesh),
                true
            );
            
            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj) {
                    if (obj.userData instanceof Notebook) {
                        const distance = camera.position.distanceTo(obj.userData.mesh.position);
                        if (distance < 3) {
                            obj.userData.collect();
                        }
                        break;
                    }
                    obj = obj.parent;
                }
            }
        });
        
        function updatePlayer(deltaTime) {
            if (gameOver || gameWon || !isLocked) return;
            
            // Reset velocity
            playerVelocity.x = 0;
            playerVelocity.z = 0;
            
            // Get movement direction
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();
            
            // Apply movement
            if (keyState['KeyW'] || keyState['ArrowUp']) {
                playerVelocity.add(forward);
            }
            if (keyState['KeyS'] || keyState['ArrowDown']) {
                playerVelocity.sub(forward);
            }
            if (keyState['KeyA'] || keyState['ArrowLeft']) {
                playerVelocity.sub(right);
            }
            if (keyState['KeyD'] || keyState['ArrowRight']) {
                playerVelocity.add(right);
            }
            
            // Normalize and apply speed
            if (playerVelocity.length() > 0) {
                playerVelocity.normalize();
                playerVelocity.multiplyScalar(player.speed * deltaTime);
            }
            
            // Jumping
            if ((keyState['Space'] || keyState[' ']) && playerOnGround) {
                playerVelocity.y = player.jumpForce * deltaTime;
                playerOnGround = false;
            }
            
            // Apply gravity
            playerVelocity.y -= player.gravity * deltaTime;
            
            // Update position
            camera.position.add(playerVelocity);
            
            // Ground collision
            if (camera.position.y < player.height) {
                camera.position.y = player.height;
                playerVelocity.y = 0;
                playerOnGround = true;
            }
            
            // Wall collisions
            camera.position.x = Math.max(-24, Math.min(24, camera.position.x));
            camera.position.z = Math.max(-24, Math.min(24, camera.position.z));
        }
        
        function restartGame() {
            while(scene.children.length > 0) {
                scene.remove(scene.children[0]);
            }
            
            gameOver = false;
            gameWon = false;
            notebooksCollected = 0;
            notebooks.length = 0;
            
            camera.position.set(0, player.height, 0);
            playerVelocity.set(0, 0, 0);
            euler.set(0, 0, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
            
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('winScreen').style.display = 'none';
            
            scene.add(ambientLight);
            scene.add(directionalLight);
            createSchool();
            baldi.init();
            
            for (let i = 0; i < notebooksNeeded; i++) {
                spawnNotebook();
            }
            
            updateUI();
            
            // Re-lock pointer
            setTimeout(() => renderer.domElement.requestPointerLock(), 100);
        }
        
        // Game loop
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.1);
            
            if (!gameOver && !gameWon) {
                updatePlayer(deltaTime);
                baldi.update(deltaTime);
                
                notebooks.forEach(notebook => {
                    if (!notebook.collected) {
                        notebook.mesh.rotation.y += deltaTime * 2;
                    }
                });
            }
            
            renderer.render(scene, camera);
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Initialize
        createSchool();
        baldi.init();
        
        for (let i = 0; i < notebooksNeeded; i++) {
            spawnNotebook();
        }
        
        animate();
    </script>
</body>
</html>
