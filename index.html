<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baldi's Basics Clone</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            cursor: none;
        }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #444;
        }
        
        #gameOver {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0000;
            font-size: 48px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 15px;
            border: 3px solid #ff0000;
        }
        
        #winScreen {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 48px;
            text-align: center;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 15px;
            border: 3px solid #00ff00;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            z-index: 200;
            pointer-events: none;
        }
        
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 19px;
            top: 10px;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 10px;
            top: 19px;
        }
        
        .crosshair-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }
        
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #444;
            white-space: nowrap;
        }
        
        .pointer-lock-prompt {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #666;
            cursor: pointer;
        }
        
        .interact-hint {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-size: 14px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            z-index: 200;
            pointer-events: none;
            display: none;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="ui">
        📓 Notebooks: <span id="notebookCount">0</span>/7
    </div>
    
    <div id="gameOver">
        <div style="font-size: 60px;">💀 GAME OVER! 💀</div>
        <span style="font-size: 20px;">Baldi got you!</span><br>
        <span style="font-size: 20px;">Press R to restart</span>
    </div>
    
    <div id="winScreen">
        <div style="font-size: 60px;">🎉 YOU WIN! 🎉</div>
        <span style="font-size: 20px;">All notebooks collected!</span><br>
        <span style="font-size: 20px;">Press R to play again</span>
    </div>
    
    <div id="crosshair">
        <div class="crosshair-dot"></div>
    </div>
    
    <div class="interact-hint" id="interactHint">Click to collect</div>
    
    <div class="instructions">
        🖱️ Click to play | WASD: Move | Mouse: Look | Click: Collect | Space: Jump | R: Restart | ESC: Menu
    </div>
    
    <div class="pointer-lock-prompt" id="lockPrompt">
        <div style="font-size: 36px;">🎮 Baldi's Basics</div>
        <div style="font-size: 18px; margin-top: 10px;">Click anywhere to start playing</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Texture generator functions
        function createFloorTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Base color
            ctx.fillStyle = '#b4b4b4';
            ctx.fillRect(0, 0, 256, 256);
            
            // Tile pattern
            ctx.fillStyle = '#a4a4a4';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillRect(128, 128, 128, 128);
            
            // Add noise/texture
            for (let i = 0; i < 5000; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                ctx.fillStyle = `rgba(${Math.random() * 50}, ${Math.random() * 50}, ${Math.random() * 50}, 0.1)`;
                ctx.fillRect(x, y, 2, 2);
            }
            
            // Grid lines
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= 256; i += 32) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, 256);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(256, i);
                ctx.stroke();
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Base color
            ctx.fillStyle = '#c8c8c8';
            ctx.fillRect(0, 0, 256, 256);
            
            // Brick pattern
            ctx.strokeStyle = '#a0a0a0';
            ctx.lineWidth = 1;
            
            for (let y = 0; y < 256; y += 32) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(256, y);
                ctx.stroke();
                
                const offset = (y / 32) % 2 === 0 ? 0 : 64;
                for (let x = offset; x < 256; x += 128) {
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + 32);
                    ctx.stroke();
                }
            }
            
            // Texture noise
            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * 256;
                const y = Math.random() * 256;
                ctx.fillStyle = `rgba(${Math.random() * 20}, ${Math.random() * 20}, ${Math.random() * 20}, 0.05)`;
                ctx.fillRect(x, y, 3, 3);
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createDeskTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            // Wood grain
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(0, 0, 128, 128);
            
            for (let i = 0; i < 20; i++) {
                const y = i * 6 + Math.random() * 4;
                ctx.strokeStyle = `rgba(139, 90, 43, ${Math.random() * 0.5})`;
                ctx.lineWidth = 1 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.quadraticCurveTo(64, y + Math.random() * 10 - 5, 128, y);
                ctx.stroke();
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createChalkboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Green chalkboard
            ctx.fillStyle = '#1E501E';
            ctx.fillRect(0, 0, 512, 256);
            
            // Chalk marks
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            for (let i = 0; i < 100; i++) {
                ctx.beginPath();
                const x = Math.random() * 512;
                const y = Math.random() * 256;
                ctx.arc(x, y, Math.random() * 20, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Math problem written on board
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.font = '24px Comic Sans MS';
            ctx.fillText('7 + 8 = ?', 50, 100);
            ctx.fillText('3 x 6 = ?', 300, 100);
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createBaldiTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            
            // Green shirt
            ctx.fillStyle = '#008000';
            ctx.fillRect(0, 0, 256, 256);
            
            // Shirt details
            ctx.fillStyle = '#006000';
            ctx.fillRect(64, 0, 128, 10);
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createNotebookTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 320;
            const ctx = canvas.getContext('2d');
            
            // Green cover
            ctx.fillStyle = '#00cc00';
            ctx.fillRect(0, 0, 256, 320);
            
            // Border
            ctx.strokeStyle = '#008800';
            ctx.lineWidth = 4;
            ctx.strokeRect(5, 5, 246, 310);
            
            // Title
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Comic Sans MS';
            ctx.textAlign = 'center';
            ctx.fillText('MATH', 128, 80);
            ctx.fillText('NOTEBOOK', 128, 120);
            
            // Lines
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                ctx.moveTo(20, 160 + i * 15);
                ctx.lineTo(236, 160 + i * 15);
                ctx.stroke();
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        function createPosterTexture(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = color;
            ctx.fillRect(0, 0, 256, 384);
            
            // Border
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 3;
            ctx.strokeRect(10, 10, 236, 364);
            
            // Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 32px Comic Sans MS';
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 192);
            
            return new THREE.CanvasTexture(canvas);
        }
        
        // Game state
        let gameOver = false;
        let gameWon = false;
        let notebooksCollected = 0;
        const notebooksNeeded = 7;
        let isLocked = false;
        
        // Three.js setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 25, 55);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.7, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);
        
        // Create textures
        const floorTexture = createFloorTexture();
        floorTexture.wrapS = THREE.RepeatWrapping;
        floorTexture.wrapT = THREE.RepeatWrapping;
        floorTexture.repeat.set(4, 4);
        
        const wallTexture = createWallTexture();
        wallTexture.wrapS = THREE.RepeatWrapping;
        wallTexture.wrapT = THREE.RepeatWrapping;
        wallTexture.repeat.set(2, 1);
        
        const deskTexture = createDeskTexture();
        const chalkboardTexture = createChalkboardTexture();
        const notebookTexture = createNotebookTexture();
        
        // Pointer lock setup
        const lockPrompt = document.getElementById('lockPrompt');
        
        function lockPointer() {
            renderer.domElement.requestPointerLock();
        }
        
        renderer.domElement.addEventListener('click', lockPointer);
        lockPrompt.addEventListener('click', lockPointer);
        
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
            lockPrompt.style.display = isLocked ? 'none' : 'block';
            document.body.style.cursor = isLocked ? 'none' : 'default';
        });
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x666666, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // Player setup
        const player = {
            height: 1.7,
            speed: 8,
            jumpForce: 8,
            gravity: 20
        };
        
        const playerVelocity = new THREE.Vector3();
        let playerOnGround = true;
        
        // Camera rotation
        const euler = new THREE.Euler(0, 0, 0, 'YXZ');
        euler.order = 'YXZ';
        
        // Create school environment
        function createSchool() {
            // Floor
            const floorGeometry = new THREE.PlaneGeometry(50, 50);
            const floorMaterial = new THREE.MeshStandardMaterial({ 
                map: floorTexture,
                roughness: 0.8
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;
            floor.receiveShadow = true;
            scene.add(floor);
            
            // Walls
            const wallMaterial = new THREE.MeshStandardMaterial({ 
                map: wallTexture,
                roughness: 0.9
            });
            
            function createWall(x, z, width, depth, rotation = 0) {
                const geometry = new THREE.BoxGeometry(width, 4, depth);
                const wall = new THREE.Mesh(geometry, wallMaterial);
                wall.position.set(x, 2, z);
                wall.rotation.y = rotation;
                wall.castShadow = true;
                wall.receiveShadow = true;
                scene.add(wall);
            }
            
            // Outer walls
            createWall(0, 25, 50, 1);
            createWall(0, -25, 50, 1);
            createWall(25, 0, 1, 50);
            createWall(-25, 0, 1, 50);
            
            // Inner walls
            createWall(-10, 0, 1, 30);
            createWall(10, 0, 1, 30);
            
            // Doorways in inner walls
            const doorwayMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.6
            });
            
            [-10, 10].forEach(x => {
                [-5, 5].forEach(z => {
                    const doorFrame1 = new THREE.Mesh(
                        new THREE.BoxGeometry(1.2, 0.2, 0.3),
                        doorwayMaterial
                    );
                    doorFrame1.position.set(x, 3.8, z);
                    scene.add(doorFrame1);
                    
                    const doorFrame2 = new THREE.Mesh(
                        new THREE.BoxGeometry(0.2, 0.2, 1.2),
                        doorwayMaterial
                    );
                    doorFrame2.position.set(x, 3.8, z);
                    scene.add(doorFrame2);
                });
            });
            
            // Desks and chairs
            const deskMaterial = new THREE.MeshStandardMaterial({ 
                map: deskTexture,
                roughness: 0.7
            });
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x654321,
                roughness: 0.6
            });
            
            for (let i = 0; i < 5; i++) {
                for (let j = 0; j < 3; j++) {
                    const x = -7 + i * 3;
                    const z = -10 + j * 5;
                    
                    const deskTop = new THREE.Mesh(
                        new THREE.BoxGeometry(1.5, 0.1, 1),
                        deskMaterial
                    );
                    deskTop.position.set(x, 0.6, z);
                    deskTop.castShadow = true;
                    deskTop.receiveShadow = true;
                    scene.add(deskTop);
                    
                    const legPositions = [[-0.6, -0.4], [0.6, -0.4], [-0.6, 0.4], [0.6, 0.4]];
                    legPositions.forEach(([dx, dz]) => {
                        const leg = new THREE.Mesh(
                            new THREE.BoxGeometry(0.1, 0.5, 0.1),
                            legMaterial
                        );
                        leg.position.set(x + dx, 0.3, z + dz);
                        leg.castShadow = true;
                        scene.add(leg);
                    });
                }
            }
            
            // Chalkboard
            const chalkboard = new THREE.Mesh(
                new THREE.BoxGeometry(4, 2, 0.1),
                new THREE.MeshStandardMaterial({ 
                    map: chalkboardTexture,
                    roughness: 0.9
                })
            );
            chalkboard.position.set(0, 2, -24.5);
            scene.add(chalkboard);
            
            // Chalkboard frame
            const frameMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x8B4513,
                roughness: 0.5
            });
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(4.2, 2.2, 0.15),
                frameMaterial
            );
            frame.position.set(0, 2, -24.55);
            scene.add(frame);
            
            // Posters
            const posterTexts = ['MATH!', 'READ!', 'LEARN!', 'STUDY!', 'THINK!'];
            posterTexts.forEach((text, index) => {
                const color = `hsl(${index * 60}, 70%, 50%)`;
                const texture = createPosterTexture(text, color);
                const poster = new THREE.Mesh(
                    new THREE.PlaneGeometry(1, 1.5),
                    new THREE.MeshStandardMaterial({ 
                        map: texture,
                        roughness: 0.5
                    })
                );
                poster.position.set(
                    Math.random() * 40 - 20,
                    2 + Math.random() * 1,
                    (Math.random() > 0.5 ? 24.5 : -24.5)
                );
                poster.rotation.y = poster.position.z > 0 ? Math.PI : 0;
                scene.add(poster);
            });
            
            // Ceiling lights
            for (let x = -15; x <= 15; x += 10) {
                for (let z = -15; z <= 15; z += 10) {
                    const lightFixture = new THREE.Mesh(
                        new THREE.BoxGeometry(2, 0.2, 1),
                        new THREE.MeshStandardMaterial({ 
                            color: 0xFFFFCC,
                            emissive: 0x666600,
                            emissiveIntensity: 0.5
                        })
                    );
                    lightFixture.position.set(x, 3.9, z);
                    scene.add(lightFixture);
                }
            }
        }
        
        // Baldi character
        const baldi = {
            mesh: null,
            speed: 2.5,
            slapCooldown: 0,
            
            init() {
                const group = new THREE.Group();
                
                // Body with texture
                const body = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.3, 1.8, 8),
                    new THREE.MeshStandardMaterial({ 
                        color: 0x008000,
                        roughness: 0.7
                    })
                );
                body.position.y = 0.9;
                body.castShadow = true;
                group.add(body);
                
                // Belt
                const belt = new THREE.Mesh(
                    new THREE.TorusGeometry(0.32, 0.05, 8, 16),
                    new THREE.MeshStandardMaterial({ color: 0x000000 })
                );
                belt.position.y = 1.2;
                belt.rotation.x = Math.PI / 2;
                group.add(belt);
                
                // Head
                const head = new THREE.Mesh(
                    new THREE.SphereGeometry(0.35, 16, 16),
                    new THREE.MeshStandardMaterial({ 
                        color: 0xFFDBB5,
                        roughness: 0.6
                    })
                );
                head.position.y = 1.95;
                head.castShadow = true;
                group.add(head);
                
                // Hair
                const hair = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.35, 0.35, 0.1, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4A2800 })
                );
                hair.position.y = 2.25;
                group.add(hair);
                
                // Ruler
                const ruler = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, 0.1, 0.8),
                    new THREE.MeshStandardMaterial({ 
                        color: 0xDEB887,
                        roughness: 0.5
                    })
                );
                ruler.position.set(0.3, 1.2, 0);
                ruler.rotation.z = 0.3;
                ruler.castShadow = true;
                group.add(ruler);
                
                // Ruler markings
                for (let i = 0; i < 7; i++) {
                    const mark = new THREE.Mesh(
                        new THREE.BoxGeometry(0.02, 0.02, 0.04),
                        new THREE.MeshStandardMaterial({ color: 0x000000 })
                    );
                    mark.position.set(0.3, 1.25, -0.3 + i * 0.1);
                    ruler.add(mark);
                }
                
                // Eyes
                const eyeGeometry = new THREE.SphereGeometry(0.08, 8, 8);
                const eyeMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xFFFFFF,
                    roughness: 0.2
                });
                const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
                
                const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                leftEye.position.set(-0.15, 2.05, -0.3);
                group.add(leftEye);
                
                const leftPupil = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 8, 8),
                    pupilMaterial
                );
                leftPupil.position.set(-0.15, 2.05, -0.36);
                group.add(leftPupil);
                
                const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
                rightEye.position.set(0.15, 2.05, -0.3);
                group.add(rightEye);
                
                const rightPupil = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 8, 8),
                    pupilMaterial
                );
                rightPupil.position.set(0.15, 2.05, -0.36);
                group.add(rightPupil);
                
                // Smile
                const smileCurve = new THREE.EllipseCurve(0, 0, 0.1, 0.06, 0, Math.PI);
                const smilePoints = smileCurve.getPoints(10);
                const smileGeometry = new THREE.BufferGeometry().setFromPoints(
                    smilePoints.map(p => new THREE.Vector3(p.x, p.y, 0))
                );
                const smile = new THREE.Line(
                    smileGeometry,
                    new THREE.LineBasicMaterial({ color: 0x000000 })
                );
                smile.position.set(0, 1.9, -0.35);
                smile.rotation.x = Math.PI;
                group.add(smile);
                
                this.mesh = group;
                this.mesh.position.set(10, 0, 0);
                scene.add(this.mesh);
            },
            
            update(deltaTime) {
                if (gameOver || gameWon) return;
                
                const direction = new THREE.Vector3()
                    .subVectors(camera.position, this.mesh.position)
                    .normalize();
                direction.y = 0;
                
                this.mesh.position.add(direction.multiplyScalar(this.speed * deltaTime));
                this.mesh.lookAt(camera.position.x, this.mesh.position.y, camera.position.z);
                
                this.slapCooldown -= deltaTime;
                const distance = this.mesh.position.distanceTo(camera.position);
                
                if (distance < 2 && this.slapCooldown <= 0) {
                    this.slapPlayer();
                }
            },
            
            slapPlayer() {
                this.slapCooldown = 1.5;
                
                // Screen shake effect
                const shakeIntensity = 0.2;
                const shakeDuration = 500;
                const startTime = Date.now();
                
                function shake() {
                    const elapsed = Date.now() - startTime;
                    if (elapsed < shakeDuration) {
                        const intensity = shakeIntensity * (1 - elapsed / shakeDuration);
                        camera.position.x += (Math.random() - 0.5) * intensity;
                        camera.position.y += (Math.random() - 0.5) * intensity;
                        requestAnimationFrame(shake);
                    }
                }
                shake();
                
                // Flash effect
                const flash = document.createElement('div');
                flash.style.cssText = `
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(255, 0, 0, 0.3);
                    z-index: 300;
                    pointer-events: none;
                    transition: opacity 0.5s;
                `;
                document.body.appendChild(flash);
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 500);
                }, 100);
                
                gameOver = true;
                document.getElementById('gameOver').style.display = 'block';
                document.exitPointerLock();
            }
        };

                    document.exitPointerLock();
